<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f2ed">
  <meta name="description" content="USB PWM tester for ESP32-S3 SuperMini. Select GPIOs, control servo pulses and two digital outputs, and install firmware from your browser.">
  <title>PWM Tester</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="install.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <header>
      <div class="brand"><svg viewBox="0 0 40 32" aria-hidden="true"><path d="M1 25h8V7h13v18h16"/></svg><h1>PWM Tester</h1></div>
      <a href="https://github.com/qwertpas/pwmtester" target="_blank" rel="noreferrer">Source <span aria-hidden="true">↗</span></a>
    </header>
    <section class="connection" aria-label="USB connection">
      <div><span class="eyebrow">ESP32-S3 SUPERMINI</span><p class="connection-state"><span id="dot" class="dot"></span><strong id="connection">Disconnected</strong></p></div>
      <button id="connect" class="primary">Connect USB</button>
    </section>
    <p id="message" role="status" aria-live="polite" hidden></p>
    <div class="layout">
      <section class="panel signal" aria-labelledby="signal-title">
        <div class="section-head"><h2 id="signal-title">PWM signal</h2><span class="tag">50 Hz</span></div>
        <div class="pulse"><output id="pulse-value" for="pulse pulse-number">1500</output><span>µs</span></div>
        <label class="sr-only" for="pulse">Pulse width</label>
        <input id="pulse" type="range" min="1000" max="2000" value="1500" step="1">
        <div class="scale"><span>1000 µs</span><span>1500 µs</span><span>2000 µs</span></div>
        <div class="pulse-controls"><label for="pulse-number">Pulse width <input id="pulse-number" type="number" required min="1000" max="2000" step="1" value="1500" inputmode="numeric"><span>µs</span></label><button id="center">Center · 1500</button></div>
        <figure>
          <svg viewBox="0 0 660 132" role="img" aria-labelledby="wave-title"><title id="wave-title">Pulse preview: 1500 microseconds in a 20 millisecond period</title><defs><pattern id="grid" width="30" height="25" patternUnits="userSpaceOnUse"><path d="M30 0H0V25" fill="none" stroke="currentColor" stroke-width=".6"/></pattern></defs><rect width="660" height="108" fill="url(#grid)"/><path id="wave" d="M0 83H30V23H75V83H630V23H660"/><text x="0" y="129">0 ms</text><text x="600" y="129">20 ms</text></svg>
          <figcaption><span>Signal preview</span><span id="duty">7.50% duty</span></figcaption>
        </figure>
        <div class="output-row"><div><strong id="output-state">Outputs off</strong></div><button id="enable" class="primary" disabled>Enable outputs</button><button id="stop" class="danger" disabled>Stop</button></div>
      </section>
      <section class="panel pins" aria-labelledby="pins-title">
        <div class="section-head"><h2 id="pins-title">Servo pins</h2></div>
        <div class="servo-pin ground">
          <span class="wire" aria-hidden="true"></span>
          <label for="ground">Ground</label>
          <select id="ground" aria-label="Ground GPIO"></select>
          <select id="ground-level" aria-label="Ground level"><option value="0">LOW</option><option value="1">HIGH</option></select>
        </div>
        <div class="servo-pin power">
          <span class="wire" aria-hidden="true"></span>
          <label for="power">Power</label>
          <select id="power" aria-label="Power GPIO"></select>
          <select id="power-level" aria-label="Power level"><option value="1">HIGH</option><option value="0">LOW</option></select>
        </div>
        <div class="servo-pin signal">
          <span class="wire" aria-hidden="true"></span>
          <label for="pwm">Signal</label>
          <select id="pwm" aria-label="Signal GPIO"></select>
          <span class="pin-value">PWM</span>
        </div>
        <p id="pin-error" role="alert" hidden>Choose a different GPIO for each output.</p>
      </section>
    </div>
    <section class="install" aria-label="Firmware installation">
      <esp-web-install-button id="installer" manifest="firmware/manifest.json"><button id="install" slot="activate">Install firmware</button><span slot="unsupported">Open in desktop Chrome or Edge to install.</span><span slot="not-allowed">Open this site over HTTPS to install.</span></esp-web-install-button>
    </section>
  </main>
</body>
</html>
